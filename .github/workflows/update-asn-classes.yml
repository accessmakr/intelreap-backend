name: Update ASN classes

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build ASN class list from public-domain data
        run: node scripts/build-asn-classes.js
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/asn-classes.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/asn-classes.json
            git commit -m "chore: refresh ASN classes [skip ci]"
            git push
          fi
