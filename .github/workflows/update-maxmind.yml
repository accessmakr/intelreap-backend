name: Update MaxMind Databases

# Every two weeks (1st and 15th). The MaxMind databases are never
# committed to this public repository (the MaxMind licence forbids
# sharing them). The newest files are force-pushed (history
# discarded) to a PRIVATE repository named by the GEO_DATA_REPO
# secret, and a one-line stamp file is pushed to the branch
# Cloudflare builds so it rebuilds and downloads them.
on:
  schedule:
    - cron: '0 3 1,15 * *'
  workflow_dispatch:
    inputs:
      build_branch:
        description: 'Branch to stamp so Cloudflare rebuilds'
        required: false
        default: 'cloudflare-worker'

permissions:
  contents: write

env:
  # Change to main when Cloudflare's production branch becomes main.
  DEFAULT_BUILD_BRANCH: cloudflare-worker

jobs:
  update:
    name: Download MaxMind GeoLite2 Databases
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Download MaxMind databases
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: node scripts/download-maxmind.js

      - name: Verify database files
        run: |
          ls -lh data/geoip/
          for f in GeoLite2-City.mmdb GeoLite2-ASN.mmdb; do
            test "$(stat -c%s data/geoip/$f)" -gt 1000000 || { echo "$f too small"; exit 1; }
          done

      - name: Check the private data repository is configured
        env:
          GEO_DATA_REPO: ${{ secrets.GEO_DATA_REPO }}
          GEO_DATA_PUSH_TOKEN: ${{ secrets.GEO_DATA_PUSH_TOKEN }}
        run: |
          if [ -z "$GEO_DATA_REPO" ] || [ -z "$GEO_DATA_PUSH_TOKEN" ]; then
            echo "GEO_DATA_REPO and GEO_DATA_PUSH_TOKEN secrets are not set. Nothing was published (the databases must never go into this public repository)."
            exit 1
          fi

      - name: Publish files to the private data repository (history discarded)
        env:
          GEO_DATA_REPO: ${{ secrets.GEO_DATA_REPO }}
          GEO_DATA_PUSH_TOKEN: ${{ secrets.GEO_DATA_PUSH_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/geo && mkdir /tmp/geo
          cp data/geoip/GeoLite2-City.mmdb data/geoip/GeoLite2-ASN.mmdb /tmp/geo/
          date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/geo/BUILT.txt
          cd /tmp/geo
          git init -q -b main
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git commit -qm "GeoLite2 data $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${GEO_DATA_PUSH_TOKEN}@github.com/${GEO_DATA_REPO}.git" main

      - name: Stamp the build branch so Cloudflare rebuilds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BRANCH: ${{ inputs.build_branch }}
        run: |
          set -e
          BRANCH="${INPUT_BRANCH:-$DEFAULT_BUILD_BRANCH}"
          rm -rf /tmp/stamp
          git clone -q --depth 1 -b "$BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" /tmp/stamp
          cd /tmp/stamp
          date -u +%Y-%m-%dT%H:%M:%SZ > data/geo-stamp.txt
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/geo-stamp.txt
          git commit -qm "chore: geo data refreshed $(date -u +%Y-%m-%d), rebuild Worker"
          git push -q origin "$BRANCH"

      - name: Report status
        if: always()
        run: echo "Finished $(date -u), status ${{ job.status }}"
